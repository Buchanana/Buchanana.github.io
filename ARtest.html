<!DOCTYPE html>
<html>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- we import arjs version without NFT but with marker + location based support -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="js/aframe-particle-system-component.js"></script>
  <body style="margin : 0px; overflow: hidden;">
    <a-scene 
    renderer="logarithmicDepthBuffer: true;"
    renderer="gammaOutput: true"
    embedded arjs>

      <a-assets>
        <a-asset-item id="decor" src="models/XMAS_AR.gltf"></a-asset-item>
      </a-assets>
      <a-marker preset="hiro">
        <a-entity 
            position="0 0 0" 
            particle-system="
                texture: star.png;
                color: #FF0000, #FFFF00; 
                size: 1, 0;
                velocityValue: 0.001 0.001 0.001;
                velocitySpread: 0.5 0 0.5; 
                accelerationValue: 0.001 0.001 0.001;
                accelerationSpread: 0.001 0.001 0.001;
                rotationAngle: 0; 
                blending: 1;
                particleCount: 200;
                maxAge: 5; ">
        </a-entity>
        <a-entity
          position="0 0 0"
          scale="1 1 1"
          rotation="0 -90 90"
          gltf-model="#decor"
        ></a-entity>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
