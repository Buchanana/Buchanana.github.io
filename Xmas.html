<!DOCTYPE html>
<html>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- we import arjs version without NFT but with marker + location based support -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="https://unpkg.com/@c-frame/aframe-particle-system-component@1.2.x/dist/aframe-particle-system-component.min.js"></script>
  <body style="margin : 0px; overflow: hidden;">
    <a-scene 
    renderer="logarithmicDepthBuffer: true;"
    renderer="gammaOutput: true"
    vr-mode-ui="enabled: false"
    embedded arjs>

      <a-assets>
        <a-asset-item id="decor" src="models/XMAS_AR.gltf"></a-asset-item>
      </a-assets>
      <a-marker preset='pattern' type='pattern' url='pattern-TreeMarker.patt'>
         <a-entity particle-system="preset: snow; size: 5; particleCount: 5000" position="0 0 -10" ></a-entity>
         <a-entity position="0 0 -10" particle-system="preset: dust; texture: star.png; size: 5; particleCount: 3000; color: #0000FF,#00FF00,#FF0000"></a-entity>

        <a-entity
          position="0 0 0"
          scale="1 1 1"
          rotation="0 -90 90"
          gltf-model="#decor"
        ></a-entity>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
